<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopYogi</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    background:#f5f5f5;
}

header{
    background:#ee4d2d;
    color:white;
    padding:15px 8%;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:28px;
    font-weight:bold;
}

.search{
    width:50%;
}

.search input{
    width:100%;
    padding:10px;
    border:none;
    border-radius:5px;
}

.hero{
    background:linear-gradient(135deg,#ee4d2d,#ff7337);
    color:white;
    text-align:center;
    padding:80px 20px;
}

.hero h1{
    font-size:45px;
    margin-bottom:15px;
}

.hero p{
    margin-bottom:20px;
}

.hero button{
    padding:12px 25px;
    border:none;
    border-radius:5px;
    background:white;
    color:#ee4d2d;
    font-weight:bold;
    cursor:pointer;
}

.products{
    padding:50px 8%;
}

.products h2{
    margin-bottom:25px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:20px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 3px 10px rgba(0,0,0,0.1);
}

.card img{
    width:100%;
    height:200px;
    object-fit:cover;
}

.card-content{
    padding:15px;
}
